# Déploiement Fly.io : `fly deploy` construit le Dockerfile sur les serveurs de Fly.
app = "site-menuiserie"
primary_region = "cdg"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # La machine se met en veille sans visiteur et se réveille à la première requête
  # (moins d'une seconde) : le site ne coûte presque rien quand personne ne le consulte.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
